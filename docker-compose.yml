services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bandera-asistencia
    restart: unless-stopped
    ports:
      # Si corres docker compose en tu VPS, se mapea al puerto 3005 del host para no chocar con el 3000.
      # En Dokploy con dominio no necesitas abrir puertos en el host.
      - "${HOST_PORT:-3005}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/data.sqlite
      - AUTO_SEED=true
      - TZ=America/Lima
    volumes:
      # Persists SQLite database across container recreations & Dokploy redeployments
      - asistencia-data:/app/data

volumes:
  asistencia-data:
    driver: local
